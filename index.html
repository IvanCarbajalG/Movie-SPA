<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie SPA - Prueba Técnica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>MovieFinder SPA</h1>
        
        <form id="search-form">
            <input type="text" id="search-input" placeholder="Buscar película (ej. Batman)..." required>
            
            <select id="type-select">
                <option value="">Tipo: Todos</option>
                <option value="movie">Película</option>
                <option value="series">Serie</option>
                <option value="episode">Episodio</option>
            </select>
            
            <input type="number" id="year-input" placeholder="Año (YYYY)">
            
            <button type="submit">Buscar</button>
        </form>
    </header>

    <main>
        <section class="content">
            <h2>Resultados</h2>
            <div id="results-container" class="grid-container">
                <p>Usa el buscador para encontrar películas.</p>
            </div>
        </section>

        <aside id="favorites-sidebar">
            <h2>Favoritos</h2>
            <div class="sort-controls">
                <small>Ordenar por:</small>
                <select id="sort-favorites">
                    <option value="date">Fecha añadido</option>
                    <option value="az">A-Z</option>
                </select>
            </div>
            <div id="favorites-list">
                </div>
        </aside>
    </main>

    <div id="movie-modal" class="modal" aria-hidden="true" role="dialog">
        <div class="modal-content">
            <span class="close-button" aria-label="Cerrar modal">&times;</span>
            <div id="modal-body">
                </div>
        </div>
    </div>

    <script src="src/main.js" type="module"></script>
</body>
</html>
